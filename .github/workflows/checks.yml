# The checks that have to pass before anything reaches production.
#
# The site deploys straight to a live domain with no staging in between, so this
# is the only thing standing between a bad edit and a broken page in front of a
# customer. Every one of these exists because something got through: an unknown
# key in vercel.json took production down for two deploys with no build log, a
# component runtime swallowed a syntax error and served a dead contact page, and
# a Learn index advertised nine guides that linked nowhere.
#
# Free to run. No API keys, no external calls.

name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install a browser
        run: npm i -D playwright@1 && npx playwright install --with-deps chromium

      - name: vercel.json, and what its header rules actually match
        run: node checks/config.mjs

      - name: Rebuild, and fail if the build is not idempotent
        run: |
          for s in build tools guides learnindex headmeta launchstate footer autolink optimise_images searchindex llms sitemap; do
            python3 "gen/$s.py" > /dev/null
          done
          if ! git diff --quiet; then
            echo "::error::Generated output differs from what is committed. Run the generators and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
          echo "generated output matches the repository"

      # Free and offline. It proves the compliance gate's text extraction reaches
      # the rules, which is the difference between a gate reporting nothing and a
      # gate seeing nothing. The judgements themselves need a key and run in the
      # daily loop.
      - name: The compliance gate can see what it is judging
        run: python3 checks/compliance.py --extraction-only

      # The daily loop reads the JSON under seo/ at one in the morning, and until
      # this step nothing read it at push time. On 18 November a channel of a new
      # shape went into seo/backlinks.json, this workflow went green, and the
      # scheduled run the next morning raised KeyError in its fourth step and did
      # none of its work. Every script the loop runs has a mode that needs no key
      # and writes nothing, so run them all here and find that out on the push.
      - name: The daily loop's scripts can read what is committed
        run: |
          pip install -q -r requirements.txt
          for c in "backlinks.py" "refresh.py --age" "refresh.py --plan" \
                   "opportunities.py" "triage.py --dry-run" \
                   "competitors.py --dry-run" "internal_links.py --dry-run"; do
            if ! python3 seo/$c > /tmp/loop-smoke.txt 2>&1; then
              echo "::error::seo/$c failed on the committed data. The daily loop would fail the same way tonight."
              tail -20 /tmp/loop-smoke.txt
              exit 1
            fi
            echo "seo/$c reads the committed data"
          done
          if ! git diff --quiet; then
            echo "::error::An offline mode wrote to the repository, which it must not."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Internal links resolve, and nothing is orphaned
        run: node checks/linkcheck.mjs

      - name: Serve the site
        run: |
          cd docs && nohup python3 -m http.server 8777 > /dev/null 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8777/index.html && break
            sleep 0.5
          done
          curl -sf -o /dev/null http://127.0.0.1:8777/index.html

      - name: Titles, descriptions, canonicals and structured data
        run: node checks/seocheck.mjs

      - name: Every page within three clicks of the home page
        run: node checks/depth.mjs

      - name: Overflow, console errors, dead links, in a real browser
        run: node checks/sweep.mjs
